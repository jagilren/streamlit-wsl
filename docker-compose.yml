services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - ptar-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ptar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ptar-dashboard:
    build: .
    container_name: ptar-dashboard
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Credenciales — editables sin reconstruir la imagen
      - ./credentials.yaml:/app/credentials.yaml:rw
      # Logs de db.py accesibles desde el host
      - ./logs:/app/logs
    networks:
      - ptar-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: jagilren@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Ptar2026!
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ptar-shared
    depends_on:
      - timescaledb

  dqo-streamer:
    build: .
    container_name: dqo-streamer
    restart: unless-stopped
    command: ["python", "-m", "datos_dqo.streamer"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # En la red de Docker, el host de la BD es el nombre del servicio.
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DQO_STREAMER_LOG: INFO
      TZ: America/Bogota
    volumes:
      # Bind-mount del paquete (no se copia en el Dockerfile actual).
      - ./datos_dqo:/app/datos_dqo:ro
      # db.py vive en la raíz del repo y lo necesita el cargador.
      - ./db.py:/app/db.py:ro
    networks:
      - ptar-shared

  ph-data-generator:
    build: .
    container_name: ph-data-generator
    restart: unless-stopped
    command: ["python", "-m", "dashboard_ph.data_generator"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PH_GENERATOR_LOG: INFO
      PH_INTERVAL_SECONDS: 180
      TZ: America/Bogota
    volumes:
      # Bind-mount del paquete (no se copia en el Dockerfile actual).
      - ./dashboard_ph:/app/dashboard_ph:ro
      # db.py y config.py viven en la raíz del repo.
      - ./db.py:/app/db.py:ro
      - ./config.py:/app/config.py:ro
    networks:
      - ptar-shared

  od-data-generator:
    build: .
    container_name: od-data-generator
    restart: unless-stopped
    command: ["python", "-m", "dashboard_od.data_generator"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OD_GENERATOR_LOG: INFO
      OD_INTERVAL_SECONDS: 180
      TZ: America/Bogota
    volumes:
      - ./dashboard_od:/app/dashboard_od:ro
      - ./db.py:/app/db.py:ro
      - ./config.py:/app/config.py:ro
    networks:
      - ptar-shared

volumes:
  timescale_data:
  pgadmin_data:

networks:
  ptar-shared:
    external: true
